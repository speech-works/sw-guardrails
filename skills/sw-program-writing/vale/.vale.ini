# Vale config for Speechworks user-facing copy. Run from this folder:
#   vale --config .vale.ini <file.md>
StylesPath = styles
MinAlertLevel = suggestion
# Blockquotes hold quoted wording, which must stay verbatim.
SkippedScopes = script, style, pre, figure, blockquote
Vocab = Speechworks

[*.{md,txt}]
BasedOnStyles = Speechworks
